services:
  postgres:
    image: postgres:16
    container_name: radar_postgres
    environment:
      POSTGRES_USER: radar_user
      POSTGRES_PASSWORD: caseia2026
      POSTGRES_DB: startup_radar
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  qdrant:
    image: qdrant/qdrant:latest
    container_name: radar_qdrant
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage

volumes:
  postgres_data:
  qdrant_data: